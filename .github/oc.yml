
name: OpenCode V2 Agent

on:
  workflow_dispatch:
    inputs:
      task:
        description: "Agent task"
        required: true
        type: string
      model:
        description: "Provider/model"
        required: true
        default: "anthropic/claude-sonnet-4-5"
        type: string
      profile:
        description: "Trusted configuration profile"
        type: choice
        options:
          - review
          - implement

permissions:
  contents: read

jobs:
  agent:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      TASK: ${{ inputs.task }}
      MODEL: ${{ inputs.model }}
      PROFILE: ${{ inputs.profile }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      DOCS_MCP_TOKEN: ${{ secrets.DOCS_MCP_TOKEN }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install OpenCode V2
        run: |
          npm install --global @opencode/cli@2.0.27
          opencode --version

      - name: Load trusted agent profile
        shell: bash
        run: |
          case "$PROFILE" in
            review|implement) ;;
            *) exit 1 ;;
          esac

          mkdir -p "$HOME/.config/opencode"
          cp ".github/opencode/profiles/$PROFILE.json" \
             "$HOME/.config/opencode/opencode.json"

      - name: Check config sources
        run: opencode debug config

      - name: Execute agent
        run: |
          opencode run \
            --standalone \
            --model "$MODEL" \
            --agent ci-worker \
            "$TASK"

      - name: Check diff
        run: git diff --check
