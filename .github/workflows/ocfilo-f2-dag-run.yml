name: ocfilo F2 Bounded Manual DAG Run

# Manual workflow_dispatch on protected main only. Runs a reviewed DAG in up to
# 6 sequential rounds. Never pushes, opens a PR, merges, deploys or schedules
# itself. Dependencies gate ordering; results are not combined (F2.4).
on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Reviewed DAG manifest'
        type: choice
        required: true
        default: 'dag-pilot'
        options: ['dag-pilot', 'capacity-5']
      run_mode:
        description: 'config-only runs round 1 without a model call. execute contacts the free OpenCode model.'
        type: choice
        required: true
        default: 'config-only'
        options: ['config-only', 'execute']
      capacity:
        description: 'Max concurrent workers per round (3 validated; 4-5 only for capacity-5)'
        type: choice
        required: true
        default: '3'
        options: ['1', '2', '3', '4', '5']
      agent_deadline_seconds:
        description: 'Hard per-agent deadline in seconds'
        type: choice
        required: true
        default: '600'
        options: ['300', '600', '900']

permissions:
  contents: read

concurrency:
  group: ocfilo-f2-dag-run
  cancel-in-progress: false

jobs:
  round1:
    if: github.repository == 'oaslananka-dev/oc-test' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 1
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  round2:
    needs: round1
    if: ${{ !cancelled() && inputs.run_mode == 'execute' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 2
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  round3:
    needs: round2
    if: ${{ !cancelled() && inputs.run_mode == 'execute' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 3
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  round4:
    needs: round3
    if: ${{ !cancelled() && inputs.run_mode == 'execute' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 4
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  round5:
    needs: round4
    if: ${{ !cancelled() && inputs.run_mode == 'execute' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 5
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  round6:
    needs: round5
    if: ${{ !cancelled() && inputs.run_mode == 'execute' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/ocfilo-f2-dag-round.yml
    with:
      plan: ${{ inputs.plan }}
      round: 6
      run_mode: ${{ inputs.run_mode }}
      deadline_seconds: ${{ inputs.agent_deadline_seconds }}
      capacity: ${{ inputs.capacity }}

  state:
    needs: [round1, round2, round3, round4, round5, round6]
    if: ${{ !cancelled() && github.repository == 'oaslananka-dev/oc-test' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Trusted checkout without persisted credentials
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download all task evidence of this run
        uses: actions/download-artifact@v7
        with:
          pattern: ocfilo-f2-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/f2-evidence
      - name: Record final DAG state
        shell: bash
        env:
          F2_PLAN: ${{ inputs.plan }}
          F2_RUN_MODE: ${{ inputs.run_mode }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/f2-evidence" "$RUNNER_TEMP/f2-state"
          flag=''
          if [ "$F2_RUN_MODE" = 'execute' ]; then
            flag='--require-complete'
          fi
          python3 .github/scripts/ocfilo_f2_dag.py state \
            --plan "$F2_PLAN" \
            --evidence-dir "$RUNNER_TEMP/f2-evidence" \
            --out "$RUNNER_TEMP/f2-state/dag-state.json" $flag
      - name: Upload final scheduler state
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ocfilo-f2-dagstate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/f2-state/
          retention-days: 7
          if-no-files-found: warn
