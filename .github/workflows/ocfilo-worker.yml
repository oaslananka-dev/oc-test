name: ocfilo F1 OpenCode Worker
on:
  workflow_dispatch:
    inputs:
      manifest_json:
        description: 'F1 task manifest JSON (no secrets)'
        required: true
        type: string
permissions:
  contents: read
jobs:
  worker:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      OCFILO_MANIFEST: ${{ inputs.manifest_json }}
    steps:
      - name: Checkout read only
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/ocfilo_worker.py prepare
          cp "$RUNNER_TEMP/ocfilo-config.json" opencode.json
      - name: Checkout exact current PR commit for repair
        if: ${{ fromJSON(inputs.manifest_json).phase == 'repair' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > "$RUNNER_TEMP/pr-number.txt"
          import json,os
          from pathlib import Path
          m=json.loads(Path(os.environ["RUNNER_TEMP"],"ocfilo-task.json").read_text())
          print(m["pr_number"])
          PY
          number="$(cat "$RUNNER_TEMP/pr-number.txt")"
          gh api "repos/oaslananka-dev/oc-test/pulls/$number" > "$RUNNER_TEMP/pr.json"
          python3 - <<'PY' > "$RUNNER_TEMP/repair-ref.txt"
          import json,os,re
          from pathlib import Path
          pr=json.loads(Path(os.environ["RUNNER_TEMP"],"pr.json").read_text())
          m=json.loads(Path(os.environ["RUNNER_TEMP"],"ocfilo-task.json").read_text())
          ref=pr["head"]["ref"]
          if (pr["head"]["repo"]["full_name"]!="oaslananka-dev/oc-test"
              or pr["base"]["ref"]!="main"
              or not re.fullmatch(r"ocfilo/f1-[a-z0-9-]+",ref)
              or pr["head"]["sha"]!=m["expected_sha"]
              or pr["state"]!="open"):
              raise SystemExit("PR branch/head SHA mismatch; repair refused")
          print(ref)
          PY
          ref="$(cat "$RUNNER_TEMP/repair-ref.txt")"
          git fetch --no-tags --depth=1 origin "$ref"
          test "$(git rev-parse FETCH_HEAD)" = "$(python3 -c 'import json,os;from pathlib import Path;print(json.loads(Path(os.environ["RUNNER_TEMP"],"ocfilo-task.json").read_text())["expected_sha"])')"
          git checkout --detach FETCH_HEAD
      - name: Install OpenCode
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@opencode/cli@2.0.27'
          opencode --version
          opencode debug config > "$RUNNER_TEMP/resolved-config.txt"
      - name: Execute worker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocfilo-result"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          m=json.loads(Path(os.environ['RUNNER_TEMP'],'ocfilo-task.json').read_text())
          prompt=m['prompt']+"\nF1 sandbox: edit only plain text under playground/. No push, PR, config, workflow or secrets changes."
          Path(os.environ['RUNNER_TEMP'],'prompt.txt').write_text(prompt)
          PY
          opencode run --standalone --model "$(python3 -c 'import json,os;from pathlib import Path;print(json.loads(Path(os.environ["RUNNER_TEMP"],"ocfilo-task.json").read_text())["model"])')" --agent build --format default "$(cat "$RUNNER_TEMP/prompt.txt")" 2>&1 | tee "$RUNNER_TEMP/ocfilo-result/agent.log"
      - name: Install pinned Codacy review tools
        if: ${{ fromJSON(inputs.manifest_json).review_profile == 'codacy-local' }}
        shell: bash
        run: |
          set -euo pipefail
          npm install --global '@codacy/analysis-cli@0.24.0'
          codacy-analysis --version
      - name: Run changed-Python Codacy quality gate
        if: ${{ fromJSON(inputs.manifest_json).review_profile == 'codacy-local' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocfilo-result"
          git add -N -A -- . ':!opencode.json'
          git diff --name-only HEAD -- 'playground/*.py' 'playground/**/*.py' > "$RUNNER_TEMP/ocfilo-result/codacy-changed.txt"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          temp=Path(os.environ["RUNNER_TEMP"])/"ocfilo-result"
          paths=[line.strip() for line in (temp/"codacy-changed.txt").read_text().splitlines() if line.strip()]
          if not paths:
              raise SystemExit("Codacy profile requested but no changed playground Python files; refusing no-op scan")
          if not all(p.endswith(".py") and p.startswith("playground/") and Path(p).is_file() for p in paths):
              raise SystemExit("Changed Python paths invalid or missing")
          (temp/"codacy-files.json").write_text(json.dumps(paths))
          PY
          codacy-analysis init --auto --config-file "$RUNNER_TEMP/ocfilo-codacy-config.json"
          set +e
          codacy-analysis analyze --install-dependencies --config-file "$RUNNER_TEMP/ocfilo-codacy-config.json" --output-format json --output "$RUNNER_TEMP/ocfilo-result/codacy-report.json" --no-log $(cat "$RUNNER_TEMP/ocfilo-result/codacy-changed.txt")
          scan_exit=$?
          set -e
          python3 .github/scripts/ocfilo_codacy.py --report "$RUNNER_TEMP/ocfilo-result/codacy-report.json" --exit-code "$scan_exit" --files-json "$RUNNER_TEMP/ocfilo-result/codacy-files.json" --summary "$RUNNER_TEMP/ocfilo-result/codacy-summary.json"
      - name: Pre-push quality gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/ocfilo-result"
          git diff --check
          git add -N -A -- . ':!opencode.json'
          git diff --binary --no-ext-diff HEAD -- . ':!opencode.json' > "$RUNNER_TEMP/ocfilo-result/changes.patch"
          OCFILO_PATCH="$RUNNER_TEMP/ocfilo-result/changes.patch" python3 .github/scripts/ocfilo_worker.py gate
          git status --short > "$RUNNER_TEMP/ocfilo-result/status.txt"
      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocfilo-f1-${{ github.run_id }}
          path: ${{ runner.temp }}/ocfilo-result/
          retention-days: 7
          if-no-files-found: warn
