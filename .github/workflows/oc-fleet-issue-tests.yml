name: ocfilo GitHub Issue Fleet Controller Tests

on:
  pull_request:
    paths:
      - '.github/scripts/oc_fleet_issue.py'
      - '.github/scripts/oc_fleet_telemetry.py'
      - '.github/scripts/oc_fleet_telemetry_bridge.py'
      - '.github/scripts/test_oc_fleet_telemetry.py'
      - '.github/scripts/oc_fleet_tools.py'
      - '.github/scripts/test_oc_fleet_tools.py'
      - '.github/scripts/oc_fleet_identity.py'
      - '.github/scripts/test_oc_fleet_identity.py'
      - '.github/scripts/test_oc_fleet_issue.py'
      - '.github/workflows/oc-fleet-worker.yml'
      - '.github/workflows/oc-fleet-issue-tests.yml'
      - 'docs/oc-fleet-github-issue.md'
  push:
    paths:
      - '.github/scripts/oc_fleet_issue.py'
      - '.github/scripts/oc_fleet_telemetry.py'
      - '.github/scripts/oc_fleet_telemetry_bridge.py'
      - '.github/scripts/test_oc_fleet_telemetry.py'
      - '.github/scripts/oc_fleet_tools.py'
      - '.github/scripts/test_oc_fleet_tools.py'
      - '.github/scripts/oc_fleet_identity.py'
      - '.github/scripts/test_oc_fleet_identity.py'
      - '.github/scripts/test_oc_fleet_issue.py'
      - '.github/workflows/oc-fleet-worker.yml'
      - '.github/workflows/oc-fleet-issue-tests.yml'
      - 'docs/oc-fleet-github-issue.md'

permissions:
  contents: read
jobs:
  models-free-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Contract tests and CLI syntax
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_issue.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_telemetry.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_tools.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_identity.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_contract.py -v
          python3 -m py_compile .github/scripts/oc_fleet_issue.py
