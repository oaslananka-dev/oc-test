permissions:
  contents: read
jobs:
  models-free-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Contract tests and CLI syntax
        run: |
          set -euo pipefail
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_issue.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_pr_triage.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_scoped_repair.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_auto_repair.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_osv_lockfile.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_osv_publish.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_osv_discover.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_telemetry.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_observe.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_supervisor.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_cancel_admission.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_cancel_reconcile.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_approval_probe.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_cancel_target_binding.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_tools.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_identity.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_contract.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_multica.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_multica_detached.py -v
          python3 -m unittest discover -s .github/scripts -p test_oc_fleet_agent_selection.py -v
          python3 -m py_compile .github/scripts/oc_fleet_issue.py
          python3 -m unittest discover -s .github/scripts -p 'test_oc_fleet_*.py' -q
